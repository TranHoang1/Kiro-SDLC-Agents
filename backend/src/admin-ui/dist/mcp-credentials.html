<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCP Credentials</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0f1117;--surface:#1a1d27;--border:#2a2d3a;--text:#e2e8f0;--muted:#8892a4;--accent:#6366f1;--accent-hover:#4f52d9;--success:#10b981;--danger:#ef4444;--input-bg:#252837}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;min-height:100vh}
  .container{max-width:720px;margin:0 auto;padding:32px 20px}
  h1{font-size:20px;font-weight:600;margin-bottom:4px}
  .subtitle{color:var(--muted);margin-bottom:32px;font-size:13px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}
  .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .server-name{font-weight:600;font-size:15px}
  .badge{padding:3px 8px;border-radius:99px;font-size:11px;font-weight:500}
  .badge-ok{background:#10b98122;color:var(--success)}
  .badge-empty{background:#ef444422;color:var(--danger)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
  .field input{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:6px;padding:8px 11px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s}
  .field input:focus{border-color:var(--accent)}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:background .15s}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-hover)}
  .btn-primary:disabled{opacity:.5;cursor:default}
  .toast{position:fixed;top:20px;right:20px;padding:10px 16px;border-radius:8px;font-size:13px;animation:slide-in .2s;z-index:999}
  .toast-ok{background:var(--success);color:#fff}
  .toast-err{background:var(--danger);color:#fff}
  @keyframes slide-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  #login{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
  .login-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:32px;width:100%;max-width:360px}
  .login-box h2{font-size:18px;margin-bottom:4px}
  .login-box p{color:var(--muted);font-size:13px;margin-bottom:24px}
  .login-box .field input{padding:10px 12px}
  .login-box .btn-primary{width:100%;justify-content:center;padding:10px}
  .err-msg{color:var(--danger);font-size:12px;margin-top:10px;text-align:center}
  .empty{text-align:center;padding:48px;color:var(--muted)}
  .divider{border:none;border-top:1px solid var(--border);margin:16px 0}
  .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
  .user-info{color:var(--muted);font-size:13px}
  .btn-sm{padding:5px 12px;font-size:12px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;cursor:pointer}
  .btn-sm:hover{border-color:var(--text);color:var(--text)}
</style>
</head>
<body>

<div id="login" style="display:none">
  <div class="login-box">
    <h2>MCP Credentials</h2>
    <p>Sign in to configure your MCP server credentials</p>
    <div class="field"><label>Username</label><input id="l-user" type="text" placeholder="admin" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="l-pass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn btn-primary" id="l-btn" onclick="doLogin()">Sign in</button>
    <div class="err-msg" id="l-err"></div>
  </div>
</div>

<div id="app" style="display:none" class="container">
  <div class="top-bar">
    <div>
      <h1>MCP Credentials</h1>
      <p class="subtitle" style="margin-bottom:0">Configure per-user credentials for each MCP server</p>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="user-info" id="username-label"></span>
      <button class="btn-sm" onclick="logout()">Sign out</button>
    </div>
  </div>
  <div id="servers-list"></div>
</div>

<script>
const API = '';
let token = localStorage.getItem('admin_token') || localStorage.getItem('mcp_cred_token') || '';

function toast(msg, ok=true) {
  const t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'toast-ok' : 'toast-err');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

async function doLogin() {
  const u = document.getElementById('l-user').value.trim();
  const p = document.getElementById('l-pass').value;
  const btn = document.getElementById('l-btn');
  const err = document.getElementById('l-err');
  if (!u || !p) { err.textContent = 'Enter username and password'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  err.textContent = '';
  try {
    const r = await fetch(API + '/api/admin/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const d = await r.json();
    if (!r.ok) { err.textContent = d.error || 'Login failed'; btn.disabled=false; btn.textContent='Sign in'; return; }
    token = d.token;
    localStorage.setItem('mcp_cred_token', token);
    document.getElementById('login').style.display = 'none';
    initApp(d.user);
  } catch(e) { err.textContent = 'Network error'; btn.disabled=false; btn.textContent='Sign in'; }
}

document.getElementById('l-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
document.getElementById('l-user').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('l-pass').focus(); });

function logout() {
  fetch(API + '/api/admin/auth/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + token } }).catch(()=>{});
  token = '';
  localStorage.removeItem('mcp_cred_token');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
  document.getElementById('l-pass').value = '';
}

async function initApp(user) {
  document.getElementById('app').style.display = 'block';
  if (user) document.getElementById('username-label').textContent = user.username;
  await loadServers();
}

async function loadServers() {
  const list = document.getElementById('servers-list');
  list.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const r = await fetch(API + '/api/admin/mcp/credentials', { headers: { Authorization: 'Bearer ' + token } });
    if (r.status === 401) { logout(); return; }
    const { servers } = await r.json();
    if (!servers || servers.length === 0) {
      list.innerHTML = '<div class="empty">No MCP servers with credential_mapping configured in orchestration.json</div>';
      return;
    }
    list.innerHTML = '';
    for (const s of servers) renderServer(s);
  } catch(e) { list.innerHTML = '<div class="empty">Failed to load servers</div>'; }
}

function renderServer(s) {
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-' + s.serverName;
  const isConfigured = s.configured && s.credentialFields.every(f => (s.credentials[f] || '') !== '');

  const fields = s.credentialFields.map(f => `
    <div class="field">
      <label>${f.replace(/_/g,' ')}</label>
      <input type="${f.includes('token')||f.includes('key')||f.includes('secret')||f.includes('password') ? 'password' : 'text'}"
             id="input-${s.serverName}-${f}"
             placeholder="${isConfigured && s.credentials[f]==='***' ? '(saved — enter new value to update)' : 'Enter ' + f}"
             autocomplete="off">
    </div>
  `).join('');

  card.innerHTML = `
    <div class="card-header">
      <span class="server-name">${s.serverName}</span>
      <span class="badge ${isConfigured ? 'badge-ok' : 'badge-empty'}" id="badge-${s.serverName}">
        ${isConfigured ? 'Configured' : 'Not configured'}
      </span>
    </div>
    <div class="fields-container">${fields}</div>
    <hr class="divider">
    <button class="btn btn-primary" onclick="saveCreds('${s.serverName}', ${JSON.stringify(s.credentialFields)})">Save credentials</button>
  `;
  document.getElementById('servers-list').appendChild(card);
}

async function saveCreds(serverName, fields) {
  const credentials = {};
  let allFilled = true;
  for (const f of fields) {
    const v = document.getElementById(`input-${serverName}-${f}`).value;
    if (v) credentials[f] = v;
    else allFilled = false;
  }
  if (Object.keys(credentials).length === 0) { toast('Enter at least one credential value', false); return; }

  const btn = event.target;
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const r = await fetch(API + `/api/admin/mcp/credentials/${serverName}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ credentials })
    });
    if (r.status === 401) { logout(); return; }
    if (!r.ok) { const d = await r.json(); toast(d.error || 'Save failed', false); btn.disabled=false; btn.textContent='Save credentials'; return; }
    toast(`Credentials saved for ${serverName}`);
    const badge = document.getElementById(`badge-${serverName}`);
    badge.className = 'badge badge-ok'; badge.textContent = 'Configured';
    fields.forEach(f => {
      const inp = document.getElementById(`input-${serverName}-${f}`);
      if (inp.value) { inp.value = ''; inp.placeholder = '(saved — enter new value to update)'; }
    });
    btn.disabled = false; btn.textContent = 'Save credentials';
  } catch(e) { toast('Network error', false); btn.disabled=false; btn.textContent='Save credentials'; }
}

async function boot() {
  if (token) {
    try {
      const r = await fetch(API + '/api/admin/auth/me', { headers: { Authorization: 'Bearer ' + token } });
      if (r.ok) { const u = await r.json(); initApp(u); return; }
    } catch {}
    token = '';
  }
  document.getElementById('login').style.display = 'flex';
}

boot();
</script>
</body>
</html>
